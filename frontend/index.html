  <body>
    <div id="root"></div>
    <!--
      Decodes the path 404.html encoded into the query string and restores
      the real URL via history.replaceState before React Router mounts.
      Pairs with public/404.html — see comment there.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
