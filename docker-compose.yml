services:
  postgres:
    image: postgres:16-alpine
    container_name: golden_harvest_db
    environment:
      POSTGRES_USER: gharvest
      POSTGRES_PASSWORD: gharvest_pass
      POSTGRES_DB: golden_harvest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gharvest -d golden_harvest"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
