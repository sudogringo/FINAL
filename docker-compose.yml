services:
  postgres:
    image: postgres:16-alpine
    container_name: golden_harvest_db
    environment:
      POSTGRES_USER: gharvest
      POSTGRES_PASSWORD: gharvest_pass
      POSTGRES_DB: golden_harvest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gharvest -d golden_harvest"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    # Using the official image since n8n/Dockerfile doesn't exist yet.
    # Swap to `build: {context: ./n8n, dockerfile: Dockerfile}` if a custom
    # image (e.g. for pre-installed community nodes) is needed later.
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    env_file:
      - ./n8n/.env
    ports:
      - "4343:4343"
    volumes:
      - ./n8n/data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4343/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
